# Шаблон Mihomo для DHQ: proxy-providers тянут Clash-подписку каждой 3x-ui,
# geox-url качает geoip/geosite. Маркеры XUI в выдачу не попадают.
log-level: warning
mixed-port: 7890
allow-lan: false
find-process-mode: strict
mode: rule
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  route-exclude-address:
    # {{XUI_TUN_EXCLUDE_BEGIN}}
    # {{XUI_TUN_EXCLUDE_END}}
  dns-hijack:
    - any:53

dns:
  enable: true
  respect-rules: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-filter:
    - '+.local'
    - '+.lan'
    - 'rule-set:geosite-ru@domain'
  default-nameserver:
    - 77.88.8.8
    - 1.1.1.1
  nameserver:
    - https://cloudflare-dns.com/dns-query#PROXY
    - https://dns.google/dns-query#PROXY
  nameserver-policy:
    'rule-set:geosite-ru@domain':
      - https://common.dot.dns.yandex.net/dns-query#DIRECT
  proxy-server-nameserver:
    - 77.88.8.8
    - 1.1.1.1

proxy-providers:
  # {{XUI_PROVIDERS_BEGIN}}
  # {{XUI_PROVIDERS_END}}

proxy-groups:
  - name: Reality pool
    type: select
    proxies:
      - Reality pool fallback
      - DIRECT
    use:
      # {{XUI_POOL_BEGIN}}
      # {{XUI_POOL_END}}
  - name: Reality pool fallback
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    interval: 30
    lazy: false
    expected-status: '204'
    proxies:
      - DIRECT
    use:
      # {{XUI_POOL_BEGIN}}
      # {{XUI_POOL_END}}
  - name: PROXY
    type: select
    proxies:
      - Reality pool fallback
      - Reality pool
      - DIRECT
  # --- policy groups (DHQ desktop profile) ---
  - name: Custom proxy
    type: select
    proxies:
      - PROXY
      - Local
    hidden: true
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Europe_Map.png"
  - name: Custom local
    type: select
    proxies:
      - Local
      - PROXY
    hidden: true
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Russia.png"
  - name: YouTube
