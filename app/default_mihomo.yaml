  # with the one above rather than replacing it. The overlap is the point: a
  # prefix either dataset knows about is one that should stay on the local
  # network instead of crossing a border to come back, and a gap in one list is
  # a Russian bank tunnelled abroad and refused.
  ru-extra@ipcidr: {<<: {type: http, format: text, behavior: ipcidr, interval: 86400}, url: "https://github.com/jameszeroX/zkeen-ip/releases/latest/download/ru", type: http, format: text, behavior: ipcidr, interval: 86400, proxy: DIRECT}
  ru-extra-v6@ipcidr: {<<: {type: http, format: text, behavior: ipcidr, interval: 86400}, url: "https://github.com/jameszeroX/zkeen-ip/releases/latest/download/ru6", type: http, format: text, behavior: ipcidr, interval: 86400, proxy: DIRECT}

  custom-proxy-domains: {<<: {type: http, format: mrs, behavior: domain, interval: 86400}, interval: 3600, url: "https://github.com/dashqee/dhqclash-public/releases/download/custom-mrs/custom-proxy-domains.mrs", type: http, format: mrs, behavior: domain, proxy: DIRECT}
  custom-proxy-ipcidr: {<<: {type: http, format: mrs, behavior: ipcidr, interval: 86400}, interval: 3600, url: "https://github.com/dashqee/dhqclash-public/releases/download/custom-mrs/custom-proxy-ipcidr.mrs", type: http, format: mrs, behavior: ipcidr, proxy: DIRECT}
  custom-local-domains: {<<: {type: http, format: mrs, behavior: domain, interval: 86400}, interval: 3600, url: "https://github.com/dashqee/dhqclash-public/releases/download/custom-mrs/custom-local-domains.mrs", type: http, format: mrs, behavior: domain, proxy: DIRECT}
  custom-local-ipcidr: {<<: {type: http, format: mrs, behavior: ipcidr, interval: 86400}, interval: 3600, url: "https://github.com/dashqee/dhqclash-public/releases/download/custom-mrs/custom-local-ipcidr.mrs", type: http, format: mrs, behavior: ipcidr, proxy: DIRECT}

  # Правила по процессам (PROCESS-NAME). classical/text, не .mrs.
  # Работают на Windows/macOS/Linux/Android; на iOS и на роутере
  # (find-process-mode: off) не срабатывают.
  custom-apps-proxy@classical: {<<: {type: http, format: text, behavior: classical, interval: 86400}, interval: 3600, url: "https://github.com/dashqee/dhqclash-public/releases/download/custom-mrs/custom-apps-proxy.list", type: http, format: text, behavior: classical, proxy: DIRECT}
  custom-apps-local@classical: {<<: {type: http, format: text, behavior: classical, interval: 86400}, interval: 3600, url: "https://github.com/dashqee/dhqclash-public/releases/download/custom-mrs/custom-apps-local.list", type: http, format: text, behavior: classical, proxy: DIRECT}
  blizzard-domain:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/blizzard.mrs
    path: ./rule-providers/blizzard-domain.mrs
    proxy: DIRECT
    interval: 86400
  remote-access@classical:
    type: inline
    behavior: classical
    payload:
      - 'DOMAIN-SUFFIX,anydesk.com'
      - 'DOMAIN-SUFFIX,net.anydesk.com'
      - 'DOMAIN-SUFFIX,rustdesk.com'
      - 'DOMAIN-SUFFIX,teamviewer.com'
      - 'DOMAIN-SUFFIX,teamviewer.us'
      - 'DOMAIN-SUFFIX,parsec.app'
      - 'DOMAIN-SUFFIX,remotedesktop.google.com'
      - 'DOMAIN-SUFFIX,chromoting-host.talkgadget.google.com'
      - 'DOMAIN-SUFFIX,client-channel.google.com'
  xray-block@classical:
    type: inline
    behavior: classical
    payload:
      - 'AND,((NETWORK,UDP),(DST-PORT,135))'
      - 'AND,((NETWORK,UDP),(DST-PORT,137))'
      - 'AND,((NETWORK,UDP),(DST-PORT,138))'
      - 'AND,((NETWORK,UDP),(DST-PORT,139))'
  torrent-direct@classical:
    type: inline
    behavior: classical
    payload:
      - 'PROCESS-NAME,qbittorrent'
      - 'PROCESS-NAME,qbittorrent.exe'
      - 'PROCESS-NAME,transmission'
      - 'PROCESS-NAME,transmission-daemon'
      - 'PROCESS-NAME,transmission-qt'
      - 'PROCESS-NAME,transmission-gtk'
      - 'PROCESS-NAME,Transmission'
      - 'PROCESS-NAME,deluge'
      - 'PROCESS-NAME,deluged'
      - 'PROCESS-NAME,deluge.exe'
      - 'PROCESS-NAME,utorrent.exe'
      - 'PROCESS-NAME,uTorrent'
      - 'PROCESS-NAME,μTorrent'
      - 'PROCESS-NAME,bittorrent.exe'
      - 'PROCESS-NAME,BitTorrent'
      - 'PROCESS-NAME,rtorrent'
      - 'PROCESS-NAME,tixati.exe'
      - 'PROCESS-NAME,BiglyBT'
      - 'PROCESS-NAME,Vuze'
      - 'PROCESS-NAME,Folx'
      - 'PROCESS-NAME,webtorrent'

rules:
  # {{XUI_CIDRS_BEGIN}}
  # {{XUI_CIDRS_END}}

  - RULE-SET,torrent-direct@classical,DIRECT


  # --- DHQ routing (372693108229410816) ---

  # QUIC: блокируем UDP/443 везде, КРОМЕ российских IP —
  # прямые сайты сохраняют HTTP/3, прокси-трафик уходит в TCP.
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((RULE-SET,geoip-ru@ipcidr,no-resolve)))),REJECT

  # Base filters
  - RULE-SET,adlist@domain,REJECT
  - RULE-SET,xray-block@classical,REJECT
  - RULE-SET,category-ai@domain,AI
  - RULE-SET,youtube@domain,YouTube
  - OR,((RULE-SET,telegram@domain),(RULE-SET,telegram@ipcidr,no-resolve)),Telegram

  # Custom overrides
  - RULE-SET,custom-apps-local@classical,Custom local
  - RULE-SET,custom-apps-proxy@classical,Custom proxy
  - RULE-SET,custom-local-domains,Custom local
  - RULE-SET,custom-local-ipcidr,Custom local,no-resolve
  - RULE-SET,custom-proxy-domains,Custom proxy
  - RULE-SET,custom-proxy-ipcidr,Custom proxy,no-resolve
  # Правила по процессам (только desktop/Android; на iOS/роутере игнорируются)

  # Поднятые правила (раньше были мёртвыми/конфликтующими)
  # Instagram теперь ДО meta — иначе geosite:meta перехватывал его в Social
  - RULE-SET,instagram@domain,Instagram
  # Заблокированные в РФ — ДО общего российского правила
  - RULE-SET,ru-blocked@domain,Foreign or RU Banned
  - RULE-SET,refilter@domain,Foreign or RU Banned
  - RULE-SET,linkedin@domain,Foreign or RU Banned
  # Весь российский трафик решается здесь (группа Russia, по умолчанию Local)
  - OR,((RULE-SET,geosite-ru@domain),(RULE-SET,geoip-ru@ipcidr,no-resolve),(RULE-SET,ru-extra@ipcidr,no-resolve),(RULE-SET,ru-extra-v6@ipcidr,no-resolve)),Russia
  - RULE-SET,discord@classical,Discord
  - RULE-SET,steam@domain,Steam
  - RULE-SET,politic@domain,Foreign or RU Banned

  # Media
  - RULE-SET,twitch@domain,Twitch
  - RULE-SET,spotify@domain,Media
  - OR,((DOMAIN-SUFFIX,gql.twitch.tv),(DOMAIN-SUFFIX,usher.ttvnw.net)),Twitch
  - OR,((RULE-SET,netflix@domain),(RULE-SET,netflix@ipcidr,no-resolve)),Media

  # Social
  - RULE-SET,reddit@domain,Social
  - RULE-SET,tiktok@domain,Social
  - OR,((RULE-SET,meta@domain),(RULE-SET,meta@ipcidr,no-resolve),(RULE-SET,meta@classical)),Social
  - OR,((RULE-SET,twitter@domain),(RULE-SET,twitter@ipcidr,no-resolve)),Twitter

  # Dev / Tools / Gaming
  - RULE-SET,github@domain,Dev
  - OR,((RULE-SET,google@domain),(RULE-SET,google@ipcidr,no-resolve)),Google
  - RULE-SET,speedtest@domain,Tools
  - OR,((RULE-SET,roblox@domain),(RULE-SET,AS22697@ipcidr,no-resolve)),Gaming
  - RULE-SET,blizzard-domain,Gaming
  - DOMAIN-SUFFIX,blizzard.com,Gaming
  - RULE-SET,jetbrains@classical,Dev
  - RULE-SET,atlassian@domain,Dev

  # PlayStation
  - RULE-SET,playstation@domain,PlayStation

  # Remote access
  - RULE-SET,remote-access@classical,Remote Access

  # Остатки бывших xray-* списков, которые нельзя положить в mrs
  # (keyword / regex / правила с портами). Домены и IP уехали в custom-списки.
  - DOMAIN-REGEX,^([\w\-\.]+\.)ua$,Foreign or RU Banned
  - DOMAIN-KEYWORD,farfetch,Foreign or RU Banned
  - DOMAIN-KEYWORD,asos,Foreign or RU Banned
  - DOMAIN-KEYWORD,dmarket,Foreign or RU Banned
  - DOMAIN-KEYWORD,freekassa,Foreign or RU Banned
  - DOMAIN-KEYWORD,runeforge,Gaming
  - DOMAIN-KEYWORD,lootspectrum,Gaming
  - DOMAIN-KEYWORD,allstar,Gaming
  - DOMAIN-KEYWORD,hearthstone,Gaming
  - RULE-SET,epicgames@domain,Gaming
  - DOMAIN-KEYWORD,manyvids,Adult
  - DOMAIN-KEYWORD,pornhub,Adult
  - DOMAIN-KEYWORD,mat6tube,Adult
  - DOMAIN-SUFFIX,onlyfans.com,Adult
  - DOMAIN-SUFFIX,noodlemagazine.com,Adult
  - DOMAIN-SUFFIX,bitchesgirls.tv,Adult
  - DOMAIN-SUFFIX,v1.yaoilib.net,Adult
  - DOMAIN-SUFFIX,kahoot.it,Adult
  - DOMAIN-SUFFIX,viralxxxporn.com,Adult
  - DOMAIN-SUFFIX,lolvvv.com,Adult
  - DOMAIN-SUFFIX,myanimelist.net,Adult
  - DOMAIN-SUFFIX,anistar.org,Adult
  - DOMAIN-SUFFIX,ficbook.net,Adult
  - DOMAIN-SUFFIX,pornolab.net,Adult
  - DOMAIN-KEYWORD,xhamster,Adult
  - DOMAIN-KEYWORD,xvideos,Adult
  - RULE-SET,oracle@ipcidr,Foreign or RU Banned,no-resolve

  # Cloudflare
  - OR,((RULE-SET,cloudflare@domain),(RULE-SET,cloudflare@ipcidr,no-resolve)),Cloudflare

  # CDN
  - RULE-SET,amazon@ipcidr,Amazon,no-resolve
  - RULE-SET,akamai@domain,Amazon
  - RULE-SET,akamai@ipcidr,Amazon,no-resolve
  - OR,((RULE-SET,digitalocean@domain),(RULE-SET,digitalocean@ipcidr,no-resolve)),CDN
  - OR,((RULE-SET,fastly@domain),(RULE-SET,fastly@ipcidr,no-resolve)),CDN
  - RULE-SET,oracle@domain,CDN
  - OR,((RULE-SET,hetzner@domain),(RULE-SET,hetzner@ipcidr,no-resolve)),CDN
  - RULE-SET,scaleway@ipcidr,CDN,no-resolve
  - RULE-SET,ovh@ipcidr,CDN,no-resolve
  - RULE-SET,vultr@ipcidr,CDN,no-resolve
  - RULE-SET,vodafone@ipcidr,CDN,no-resolve
  - RULE-SET,gcore@ipcidr,CDN,no-resolve
  - RULE-SET,cdn77@ipcidr,CDN,no-resolve
  - MATCH,Local
