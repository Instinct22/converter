<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Master{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=64">
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <strong>Master</strong>
        <span>флот 3x-ui</span>
      </div>
    </div>
    <nav class="nav">
      <a href="/" title="Обзор" class="{{ 'active' if page=='dashboard' else '' }}">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="6" height="6" rx="1.5"/><rect x="10" y="2" width="6" height="6" rx="1.5"/><rect x="2" y="10" width="6" height="6" rx="1.5"/><rect x="10" y="10" width="6" height="6" rx="1.5"/></svg>
        Обзор
      </a>
      <a href="/pings" title="С клиентов" class="{{ 'active' if page=='pings' else '' }}">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 13l4-4 3 3 5-6"/><path d="M3 16h12"/></svg>
        С клиентов
      </a>
      <a href="/protection" title="Защита" class="{{ 'active' if page=='protection' else '' }}">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 2.5l5.5 2v4.8c0 3.2-2.2 5.7-5.5 6.9-3.3-1.2-5.5-3.7-5.5-6.9V4.5l5.5-2z"/></svg>
        Защита
      </a>
      <a href="/templates" title="Входы" class="{{ 'active' if page=='templates' else '' }}">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h10v10H4z"/><path d="M7 8h4M7 11h6"/></svg>
        Входы
      </a>
      <a href="/releases" title="Релизы" class="{{ 'active' if page=='releases' else '' }}">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 14.5V6.5l5-3 5 3v8l-5 2-5-2z"/><path d="M9 8.5v6"/></svg>
        Релизы
      </a>
      <a href="/config" title="Профиль Clash" class="{{ 'active' if page=='config' else '' }}">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h10M4 9h10M4 13h6"/></svg>
        Профиль Clash
      </a>
      <a href="/logout" class="nav-logout" title="Выйти">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4H4v10h3M8 9h7M12 6l3 3-3 3"/></svg>
        Выйти
      </a>
    </nav>
  </aside>
  <main class="main">
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
<script id="flag-names" type="application/json">{{ flag_names|script_json }}</script>
<script src="/static/app.js?v=45"></script>
{% block scripts %}{% endblock %}
</body>
</html>
