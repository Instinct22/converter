<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Master</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=9">
</head>
<body>
<div class="login-wrap">
  <form class="card login-card" method="post" action="/login">
    <div class="brand" style="padding:0 0 12px">
      <div class="brand-mark">M</div>
      <div><strong>Master</strong><span>доступ только вам</span></div>
    </div>
    <p class="lede">Панель, с которой выдаёте клиентам одну ссылку Clash и управляете серверами 3x-ui.</p>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    <div class="field" style="margin-top:18px">
      <label>Пароль</label>
      <input type="password" name="password" autofocus required placeholder="из файла .env">
    </div>
    <button class="btn" type="submit" style="width:100%; justify-content:center">Войти</button>
  </form>
</div>
</body>
</html>
