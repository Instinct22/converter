<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03090c">
  <meta name="robots" content="noindex, nofollow">
  <title>Ссылка подписки — Aegis Gate</title>
  <link rel="icon" type="image/png" href="/static/subscription/status-on.png">
  <link rel="stylesheet" href="/static/subscription/page.css">
  <script src="/static/subscription/copy.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="brand">
      <img src="/static/subscription/status-on.png" alt="" width="25" height="25">
      <img src="/static/subscription/wordmark.webp" alt="Aegis Gate" width="99" height="21">
    </header>
    <main>
      <div class="intro">
        <h1>Ссылка <span>подписки</span></h1>
        <p>Вставьте её в приложение Aegis Gate.</p>
        <button id="copy" type="button" data-url="{{ sub_url }}" hidden>
          <span class="copy-icon" aria-hidden="true"></span>
          <span id="copy-label" aria-live="polite">Скопировать ссылку</span>
        </button>
        <div id="manual-copy" hidden>
          <label for="copy-url">Скопируйте ссылку вручную</label>
          <input id="copy-url" type="text" readonly>
        </div>
        <noscript><a href="{{ sub_url }}">Ссылка для копирования</a></noscript>
      </div>
      <div class="shield" aria-hidden="true">
        <img src="/static/subscription/emblem.webp" alt="" width="772" height="772">
      </div>
    </main>
  </div>
</body>
</html>
