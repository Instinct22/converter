services:
  xui-master:
    image: ${XUI_MASTER_IMAGE:-liiiiiiiiis/converter:latest}
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  master-metrics:
    image: ${XUI_MASTER_IMAGE:-liiiiiiiiis/converter:latest}
    command: ["python", "-m", "app.master_agent"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - master-metrics-queue:/queue
    depends_on:
      - xui-master
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/caddy-sites:/etc/caddy/sites:ro
      # Журнал запросов aegis-gate.ru. Вкладка «Сайт» читает его из data/.
      - ./data/caddy-access:/var/log/caddy-access
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge
    depends_on:
      - xui-master
    restart: unless-stopped

networks:
  edge:
    external: true
    name: edge

volumes:
  master-metrics-queue:
  caddy_data:
  caddy_config:
